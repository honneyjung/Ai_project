<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouseover Event</title>
  </head>
  <body>
    <div class="box">마우스를 올려보세요.</div>

    <script>
      const box = document.querySelector(".box");

      box.addEventListener("mouseover", () => (box.style.color = "skyblue"));

      box.addEventListener("mouseout", () => (box.style.color = "black"));
    </script>
  </body>
</html>
